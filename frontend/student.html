<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My complaints · Smart Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand"><span class="brand-mark">S</span> Smart Campus</p>
      <div class="who"><span id="userName"></span><button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button></div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">My complaints</h1>
    <p class="page-sub">Submit a new complaint and follow its progress.</p>

    <div class="layout">
      <aside class="panel sticky">
        <h2>New complaint</h2>
        <form id="complaintForm" novalidate>
          <div class="field"><label for="title">Title</label><input id="title" maxlength="120" placeholder="e.g. Projector not working in Room 204" required></div>
          <div class="row">
            <div class="field"><label for="category">Category</label><select id="category" required></select></div>
            <div class="field"><label for="priority">Priority</label><select id="priority" required></select></div>
          </div>
          <div class="field"><label for="location">Location</label><input id="location" placeholder="Building, floor or room" required></div>
          <div class="field"><label for="description">What happened?</label><textarea id="description" maxlength="2000" placeholder="Describe the problem and when it started." required></textarea></div>
          <p class="form-error" id="formError" role="alert"></p>
          <button class="btn btn-primary" style="width:100%" type="submit" id="submitBtn">Submit complaint</button>
        </form>
      </aside>

      <section>
        <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
        <div class="tickets" id="tickets" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
