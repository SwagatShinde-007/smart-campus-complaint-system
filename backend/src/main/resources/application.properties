server.port=${PORT:8080}
server.error.include-message=always

# ---- MongoDB (local). For Atlas use: mongodb+srv://<user>:<pass>@<cluster>/smart_campus
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_campus}
spring.data.mongodb.auto-index-creation=true

# ---- JWT (secret must be at least 32 characters; change it before deploying)
app.jwt.secret=${JWT_SECRET:ChangeThisSecretToALongRandomValue-AtLeast32Chars}
app.jwt.expiration-ms=86400000

# ---- Optional code required to register an admin account (set via environment)
app.admin.registration-code=${ADMIN_REGISTRATION_CODE:}

# ---- Password reset email (configure SMTP before enabling password resets)
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
